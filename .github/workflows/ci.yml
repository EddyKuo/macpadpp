name: CI

# 僅「手動」執行：不會在每次 push / PR 時自動跑，避免消耗執行器時間與通知。
# 要跑時到 GitHub「Actions ▸ CI ▸ Run workflow」按鈕手動觸發（或 gh workflow run ci.yml）。
on:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安裝相依（Homebrew）
        run: brew install cmake qt qscintilla2

      - name: 設定（Release，-Werror 由 STRICT_WARNINGS 預設開啟）
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: 建置
        run: cmake --build build -j

      - name: 測試（CTest）
        run: ctest --test-dir build --output-on-failure

  build-test-windows:
    name: Build & Test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_VERSION: 6.8.1
      QSCI_VERSION: 2.14.1
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Qt（含 WebEngine / Core5Compat 等模組）
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat qtwebengine qtwebchannel qtpositioning qtimageformats
          cache: true

      - name: 啟用 MSVC 開發者環境
        uses: ilammy/msvc-dev-cmd@v1

      # 快取必須涵蓋 nmake install 的「全部」產出：標頭 + 匯入函式庫 + DLL。
      # 先前只快取了 include/Qsci，於是快取一命中就跳過建置、但函式庫從未被還原，
      # CMake 隨即以 QSCINTILLA_LIBRARY-NOTFOUND 失敗（首次執行因未命中而看不出來，
      # 直到快取存檔後的下一次執行才爆炸）。
      - name: 還原 QScintilla 快取
        id: qsci-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.QT_ROOT_DIR }}/include/Qsci
            ${{ env.QT_ROOT_DIR }}/lib/qscintilla2_qt6*
            ${{ env.QT_ROOT_DIR }}/bin/qscintilla2_qt6*
            ${{ env.QT_ROOT_DIR }}/mkspecs/features/qscintilla2.prf
          key: qscintilla-${{ env.QSCI_VERSION }}-qt${{ env.QT_VERSION }}-msvc2022-v2

      # 以「函式庫是否真的存在」判斷要不要建置，而不是相信 cache-hit 旗標——
      # 快取內容不完整時（如上述舊 key）仍能自我修復，不會整條 pipeline 卡死。
      - name: 檢查 QScintilla 是否完整
        id: qsci-check
        shell: pwsh
        run: |
          $lib = Get-ChildItem "$env:QT_ROOT_DIR\lib" -Filter 'qscintilla2_qt6*.lib' -ErrorAction SilentlyContinue
          $hdr = Test-Path "$env:QT_ROOT_DIR\include\Qsci\qsciscintilla.h"
          $complete = ($null -ne $lib) -and $hdr
          Write-Host "QScintilla 完整=$complete (lib=$($null -ne $lib), header=$hdr)"
          "complete=$complete" >> $env:GITHUB_OUTPUT

      - name: 建置並安裝 QScintilla（快取不完整時）
        if: steps.qsci-check.outputs.complete != 'True'
        shell: cmd
        run: |
          curl -L -o qsci.tar.gz https://www.riverbankcomputing.com/static/Downloads/QScintilla/%QSCI_VERSION%/QScintilla_src-%QSCI_VERSION%.tar.gz
          tar -xzf qsci.tar.gz
          cd QScintilla_src-%QSCI_VERSION%\src
          qmake qscintilla.pro
          nmake
          nmake install

      - name: 設定（Release，/W4 /WX 由 STRICT_WARNINGS 預設開啟）
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%"

      - name: 建置
        shell: cmd
        run: cmake --build build -j

      - name: 測試（CTest；qscintilla DLL 於 Qt lib/bin）
        shell: cmd
        run: |
          set "PATH=%QT_ROOT_DIR%\bin;%QT_ROOT_DIR%\lib;%PATH%"
          ctest --test-dir build --output-on-failure

      # Windows 上測試程序若異常終止，被緩衝的 stdout 會整批遺失——CTest 的
      # --output-on-failure 便什麼都印不出來（只看得到「Failed」三個字）。
      # 這裡改用 QtTest 的檔案輸出（-o），它每跑完一個案例就寫檔，
      # 即使隨後崩潰，檔案裡的「最後一筆」就是兇手。
      - name: 失敗時輸出逐案測試日誌
        if: failure()
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:QT_ROOT_DIR\lib;$env:PATH"
          Get-ChildItem build/tests -Filter 'test_*.exe' | ForEach-Object {
            $log = Join-Path $env:RUNNER_TEMP "$($_.BaseName).qtest.txt"
            & $_.FullName -o "$log,txt" -v1 *> $null
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Write-Host "===== FAILED: $($_.BaseName)  (exit code $code) ====="
              if (Test-Path $log) { Get-Content $log }
              else { Write-Host "(未產生日誌——崩潰早於第一個案例)" }
            }
          }
