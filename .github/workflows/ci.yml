name: CI

# 建置與測試僅「手動」執行：不會在每次 push / PR 時自動跑，避免消耗執行器時間與通知。
# 要跑時到 GitHub「Actions ▸ CI ▸ Run workflow」按鈕手動觸發（或 gh workflow run ci.yml）。
#
# 例外是 icons 這個 job：圖示相關檔案一有變動就自動檢查。它跑在 ubuntu 且不編譯，
# 成本約一分鐘，但擋掉的是「建置全綠、卻做出沒有圖示的 app」這種要等到使用者
# 手上才會被發現的沉默故障。兩個重量級建置 job 仍維持手動（見其 if 條件）。
on:
  workflow_dispatch:
  push:
    paths:
      - 'resources/icon/**'
      - 'resources/icons/**'
      - 'scripts/icons/**'
      - '.github/workflows/ci.yml'

jobs:
  icons:
    name: Icons（圖示資產檢查）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安裝檢查工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          # 版本釘死：合成圖示是幾何運算，換版本可能改變輸出的小數位而造成假失敗
          pip install --quiet skia-pathops==0.9.2 fonttools==4.63.0

      # 工具列圖示的「是否算繪得出來」由 test_icons 在兩個平台的 CTest 中把關；
      # 這裡管的是資源本身的完整性與衍生檔是否過期。
      - name: 工具列圖示必須齊全且不含 currentColor
        run: |
          missing=0
          for n in new open save saveall close closeall print cut copy paste \
                   undo redo find replace zoomin zoomout syncscrollv syncscrollh \
                   wordwrap showall indentguide udl docmap doclist funclist \
                   filebrowser monitoring macrorecord macrostop macroplay \
                   macrorunmulti macrosave; do
            f="resources/icons/$n.svg"
            if [ ! -s "$f" ]; then echo "缺少或空白：$f"; missing=1; continue; fi
            # QSvgRenderer 不解析 currentColor：這種檔案打包得起來，但畫出來是全空
            if grep -q currentColor "$f"; then echo "$f 含 currentColor"; missing=1; fi
            python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse(sys.argv[1])" "$f" \
              || { echo "$f 不是合法 XML"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

      # saveall 由 save 位移疊放合成。若有人直接手改 SVG，就會與生成腳本脫節、
      # 下次重新產生時默默把修改蓋掉。這裡確認committed 的檔案確實出自腳本。
      - name: 合成圖示可由腳本重現
        run: |
          python3 scripts/icons/compose_stack.py \
            resources/icons/save.svg resources/icons/saveall.svg 0.72 4 64 24
          git diff --exit-code -- resources/icons/saveall.svg \
            || { echo "saveall.svg 與 compose_stack.py 的輸出不一致"; exit 1; }

      # .icns/.ico 是由 macpad-1024.png 產生後 commit 進來的二進位檔，沒有任何
      # 建置步驟會重新產生它們——母版改了而衍生檔沒更新，是不會有人注意到的。
      - name: 應用程式圖示未過期
        run: |
          grep -v '^#' resources/icon/SOURCE.sha256 > /tmp/icon.sums
          (cd resources/icon && sha256sum -c /tmp/icon.sums) \
            || { echo "母版已變更但衍生圖示未重建；請執行 scripts/icons/build_app_icons.sh"; exit 1; }

      - name: 應用程式圖示資產完整
        run: |
          for f in resources/icon/macpad.icns resources/icon/macpad.ico \
                   resources/icon/macpad.rc resources/icon/macpad-1024.png; do
            [ -s "$f" ] || { echo "缺少或空白：$f"; exit 1; }
          done
          # .ico 必須同時含最小與最大尺寸：缺 16 則工作列糊，缺 256 則「特大圖示」糊
          sizes=$(identify resources/icon/macpad.ico | awk '{print $3}')
          echo "$sizes" | grep -qx '16x16'   || { echo ".ico 缺 16x16";   exit 1; }
          echo "$sizes" | grep -qx '256x256' || { echo ".ico 缺 256x256"; exit 1; }

  coverage:
    name: Coverage（行覆蓋率門檻）
    runs-on: macos-14
    timeout-minutes: 60
    # 與兩個建置 job 一樣維持手動觸發：它需要自己的 instrumented 建置，
    # 成本與一次完整建置相當，不適合每次 push 都跑。
    if: github.event_name == 'workflow_dispatch'
    env:
      # 門檻刻意設在目前數字（94%）之下留一點餘裕：目的是擋住「大幅倒退」，
      # 而不是讓任何一次無關的重構因為零點幾個百分點就變紅。
      MIN_LINE_COVERAGE: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安裝相依（Homebrew）
        run: brew install cmake qt qscintilla2

      # scripts/coverage.sh 自行負責 configure、建置、逐一執行測試、
      # 合併 profraw 並產出報告；未達 MIN_LINE_COVERAGE 即以非零結束碼失敗。
      - name: 量測覆蓋率並檢查門檻
        run: bash scripts/coverage.sh coverage.txt

      # 失敗時報告本身是最有用的產物——直接看得到是哪些檔案掉下去。
      - name: 上傳覆蓋率報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt

  build-test:
    name: Build & Test (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 45
    # 圖示檔案的 push 只跑上面的 icons job，不動用昂貴的建置執行器
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: 安裝相依（Homebrew）
        run: brew install cmake qt qscintilla2

      - name: 設定（Release，-Werror 由 STRICT_WARNINGS 預設開啟）
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: 建置
        run: cmake --build build -j

      - name: 測試（CTest）
        run: ctest --test-dir build --output-on-failure

      # 建置成功不代表 app 真的有圖示：Info.plist 指到不存在的檔案時，
      # Finder 與 Dock 只會顯示通用圖示，建置與測試全程不會有任何抱怨。
      - name: 驗證 .app 真的帶著圖示
        run: |
          APP=build/src/macpad++.app
          ICNS="$APP/Contents/Resources/macpad.icns"
          [ -s "$ICNS" ] || { echo "bundle 內找不到 $ICNS"; exit 1; }
          NAME=$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")
          [ "$NAME" = "macpad.icns" ] || { echo "CFBundleIconFile 為 '$NAME'，與實際檔名不符"; exit 1; }
          echo "bundle 圖示正常：$NAME（$(wc -c < "$ICNS") bytes）"

  build-test-windows:
    name: Build & Test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    env:
      QT_VERSION: 6.8.1
      QSCI_VERSION: 2.14.1
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Qt（含 WebEngine / Core5Compat 等模組）
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat qtwebengine qtwebchannel qtpositioning qtimageformats
          cache: true

      - name: 啟用 MSVC 開發者環境
        uses: ilammy/msvc-dev-cmd@v1

      # 快取必須涵蓋 nmake install 的「全部」產出：標頭 + 匯入函式庫 + DLL。
      # 先前只快取了 include/Qsci，於是快取一命中就跳過建置、但函式庫從未被還原，
      # CMake 隨即以 QSCINTILLA_LIBRARY-NOTFOUND 失敗（首次執行因未命中而看不出來，
      # 直到快取存檔後的下一次執行才爆炸）。
      - name: 還原 QScintilla 快取
        id: qsci-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.QT_ROOT_DIR }}/include/Qsci
            ${{ env.QT_ROOT_DIR }}/lib/qscintilla2_qt6*
            ${{ env.QT_ROOT_DIR }}/bin/qscintilla2_qt6*
            ${{ env.QT_ROOT_DIR }}/mkspecs/features/qscintilla2.prf
          key: qscintilla-${{ env.QSCI_VERSION }}-qt${{ env.QT_VERSION }}-msvc2022-v2

      # 以「函式庫是否真的存在」判斷要不要建置，而不是相信 cache-hit 旗標——
      # 快取內容不完整時（如上述舊 key）仍能自我修復，不會整條 pipeline 卡死。
      - name: 檢查 QScintilla 是否完整
        id: qsci-check
        shell: pwsh
        run: |
          $lib = Get-ChildItem "$env:QT_ROOT_DIR\lib" -Filter 'qscintilla2_qt6*.lib' -ErrorAction SilentlyContinue
          $hdr = Test-Path "$env:QT_ROOT_DIR\include\Qsci\qsciscintilla.h"
          $complete = ($null -ne $lib) -and $hdr
          Write-Host "QScintilla 完整=$complete (lib=$($null -ne $lib), header=$hdr)"
          "complete=$complete" >> $env:GITHUB_OUTPUT

      - name: 建置並安裝 QScintilla（快取不完整時）
        if: steps.qsci-check.outputs.complete != 'True'
        shell: cmd
        run: |
          curl -L -o qsci.tar.gz https://www.riverbankcomputing.com/static/Downloads/QScintilla/%QSCI_VERSION%/QScintilla_src-%QSCI_VERSION%.tar.gz
          tar -xzf qsci.tar.gz
          cd QScintilla_src-%QSCI_VERSION%\src
          qmake qscintilla.pro
          nmake
          nmake install

      - name: 設定（Release，/W4 /WX 由 STRICT_WARNINGS 預設開啟）
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%"

      - name: 建置
        shell: cmd
        run: cmake --build build -j

      - name: 測試（CTest；qscintilla DLL 於 Qt lib/bin）
        shell: cmd
        run: |
          set "PATH=%QT_ROOT_DIR%\bin;%QT_ROOT_DIR%\lib;%PATH%"
          ctest --test-dir build --output-on-failure

      # src/CMakeLists.txt 已保證缺 .rc/.ico 時直接 FATAL_ERROR，這裡再確認資源
      # 真的被 rc.exe 編譯進去——設定成功不等於資源有進到 exe。
      - name: 驗證 exe 嵌入了圖示資源
        shell: pwsh
        run: |
          $res = Get-ChildItem build -Recurse -Include '*.res','macpad.rc.obj' -ErrorAction SilentlyContinue
          if (-not $res) { throw "建置產物中找不到編譯後的資源檔，exe 可能沒有圖示" }
          $res | ForEach-Object { Write-Host "資源檔：$($_.FullName) ($($_.Length) bytes)" }
          if (($res | Measure-Object -Property Length -Sum).Sum -lt 1000) {
            throw "資源檔過小，圖示可能未被嵌入"
          }

      # Windows 上測試程序若異常終止，被緩衝的 stdout 會整批遺失——CTest 的
      # --output-on-failure 便什麼都印不出來（只看得到「Failed」三個字）。
      # 這裡改用 QtTest 的檔案輸出（-o），它每跑完一個案例就寫檔，
      # 即使隨後崩潰，檔案裡的「最後一筆」就是兇手。
      - name: 失敗時輸出逐案測試日誌
        if: failure()
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:QT_ROOT_DIR\lib;$env:PATH"
          Get-ChildItem build/tests -Filter 'test_*.exe' | ForEach-Object {
            $log = Join-Path $env:RUNNER_TEMP "$($_.BaseName).qtest.txt"
            & $_.FullName -o "$log,txt" -v1 *> $null
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Write-Host "===== FAILED: $($_.BaseName)  (exit code $code) ====="
              if (Test-Path $log) { Get-Content $log }
              else { Write-Host "(未產生日誌——崩潰早於第一個案例)" }
            }
          }
